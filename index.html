<!DOCTYPE html>
<html lang="pt-br">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Call com os comedy</title>
<script src="https://cdnjs.cloudflare.com/ajax/libs/peerjs/1.5.2/peerjs.min.js"></script>
<style>
  * { box-sizing: border-box; }
  body {
    margin: 0;
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
    background: #0f1115;
    color: #e8e8ec;
    min-height: 100vh;
  }
  .top {
    padding: 14px 20px;
    background: #171a21;
    border-bottom: 1px solid #262b36;
    display: flex;
    align-items: center;
    gap: 12px;
    flex-wrap: wrap;
  }
  .top h1 { font-size: 16px; margin: 0; color: #8b8fa3; font-weight: 600; }
  input {
    background: #0f1115;
    border: 1px solid #2c3140;
    color: #e8e8ec;
    padding: 8px 12px;
    border-radius: 8px;
    font-size: 14px;
    outline: none;
  }
  input:focus { border-color: #5b6cff; }
  button {
    background: #5b6cff;
    color: white;
    border: none;
    padding: 8px 16px;
    border-radius: 8px;
    font-size: 14px;
    cursor: pointer;
    font-weight: 600;
    transition: 0.15s;
  }
  button:hover { background: #4a5be0; }
  button.secondary { background: #2c3140; }
  button.secondary:hover { background: #383e52; }
  button.danger { background: #e0475b; }
  button.danger:hover { background: #c93b4e; }
  button:disabled { opacity: 0.4; cursor: not-allowed; }
  button.active { background: #2ecc71; }

  #status { font-size: 13px; color: #8b8fa3; margin-left: auto; }

  .grid {
    display: grid;
    grid-template-columns: repeat(auto-fit, minmax(260px, 1fr));
    gap: 14px;
    padding: 20px;
  }
  .tile {
    background: #171a21;
    border-radius: 12px;
    overflow: hidden;
    position: relative;
    border: 1px solid #262b36;
    aspect-ratio: 16/9;
  }
  .tile video {
    width: 100%;
    height: 100%;
    object-fit: cover;
    background: #000;
    display: block;
    cursor: pointer;
  }
  .tile video:hover { outline: 2px solid #5b6cff; outline-offset: -2px; }
  .tile .label {
    position: absolute;
    bottom: 8px;
    left: 10px;
    background: rgba(0,0,0,0.55);
    padding: 3px 10px;
    border-radius: 6px;
    font-size: 12px;
  }
  .controls {
    position: fixed;
    bottom: 20px;
    left: 50%;
    transform: translateX(-50%);
    display: flex;
    gap: 10px;
    background: #171a21;
    padding: 10px;
    border-radius: 16px;
    border: 1px solid #262b36;
    box-shadow: 0 8px 24px rgba(0,0,0,0.4);
  }
  .hint { font-size: 12px; color: #6a6f80; padding: 0 20px 8px; }

  #chatPanel {
    position: fixed;
    top: 0;
    right: -320px;
    width: 300px;
    height: 100vh;
    background: #171a21;
    border-left: 1px solid #262b36;
    display: flex;
    flex-direction: column;
    transition: right 0.2s ease;
    z-index: 50;
  }
  #chatPanel.open { right: 0; }
  #chatHeader {
    padding: 14px 16px;
    border-bottom: 1px solid #262b36;
    font-weight: 600;
    font-size: 14px;
    color: #8b8fa3;
  }
  #chatMessages {
    flex: 1;
    overflow-y: auto;
    padding: 12px 16px;
    display: flex;
    flex-direction: column;
    gap: 8px;
  }
  .msg { font-size: 13px; line-height: 1.4; }
  .msg .who { color: #5b6cff; font-weight: 600; margin-right: 4px; }
  .msg.me .who { color: #2ecc71; }
  #chatForm {
    display: flex;
    gap: 8px;
    padding: 12px;
    border-top: 1px solid #262b36;
  }
  #chatInput {
    flex: 1;
    width: 100%;
  }

  .modal-overlay {
    display: none;
    position: fixed;
    inset: 0;
    background: rgba(0,0,0,0.6);
    z-index: 100;
    align-items: center;
    justify-content: center;
  }
  .modal-overlay.open { display: flex; }
  .modal {
    background: #171a21;
    border: 1px solid #262b36;
    border-radius: 14px;
    padding: 22px;
    width: 320px;
    max-width: 90vw;
  }
  .modal h2 { font-size: 15px; margin: 0 0 16px; color: #e8e8ec; }
  .field { margin-bottom: 18px; }
  .field label { font-size: 13px; color: #8b8fa3; display: block; margin-bottom: 8px; }
  .switch-row { display: flex; align-items: center; justify-content: space-between; }
  .switch { position: relative; width: 42px; height: 24px; }
  .switch input { opacity: 0; width: 0; height: 0; }
  .slider-bg {
    position: absolute; cursor: pointer; inset: 0;
    background: #2c3140; border-radius: 24px; transition: 0.2s;
  }
  .slider-bg:before {
    content: ""; position: absolute; height: 18px; width: 18px;
    left: 3px; bottom: 3px; background: white; border-radius: 50%; transition: 0.2s;
  }
  input:checked + .slider-bg { background: #5b6cff; }
  input:checked + .slider-bg:before { transform: translateX(18px); }
  .avatar-row { display: flex; align-items: center; gap: 12px; }
  .avatar-preview {
    width: 52px; height: 52px; border-radius: 50%;
    background: #2c3140; display: flex; align-items: center; justify-content: center;
    font-size: 18px; font-weight: 700; color: #8b8fa3; overflow: hidden; flex-shrink: 0;
  }
  .avatar-preview img { width: 100%; height: 100%; object-fit: cover; }
  .modal .close-btn { width: 100%; margin-top: 4px; }

  .avatar-tile {
    width: 100%; height: 100%; display: flex; align-items: center; justify-content: center;
    background: #20242e;
  }
  .avatar-tile img { width: 90px; height: 90px; border-radius: 50%; object-fit: cover; }
  .avatar-tile .initials {
    width: 90px; height: 90px; border-radius: 50%; background: #2c3140;
    display: flex; align-items: center; justify-content: center;
    font-size: 30px; font-weight: 700; color: #c9cbe0;
  }
</style>
</head>
<body>

<div class="top">
  <h1>📞 Call dos Amigos</h1>
  <input id="roomInput" placeholder="Código da sala (ex: turma-123)" />
  <input id="nameInput" placeholder="Seu nome" style="max-width:120px" />
  <button id="createBtn">Criar bomba</button>
  <button id="joinBtn" class="secondary">Entrar na bomba</button>
  <button id="settingsBtn" class="secondary">⚙️</button>
  <span id="status">desconectado</span>
</div>

<div class="hint" id="hint">Cria essa bomba, mande a bomba pros seus amigos, e fala pros comedy clicarem em "Entrar na sala" com essa mesma bomba.</div>

<div class="grid" id="grid"></div>

<div class="controls" id="controls" style="display:none">
  <button id="micBtn">🎤 Mic</button>
  <button id="camBtn">📷 Câmera</button>
  <button id="screenBtn">🖥️ Compartilhar tela</button>
  <button id="chatToggleBtn" class="secondary">💬 Chat</button>
  <button id="leaveBtn" class="danger">Sair</button>
</div>

<div id="chatPanel">
  <div id="chatHeader">Chat da sala</div>
  <div id="chatMessages"></div>
  <form id="chatForm">
    <input id="chatInput" placeholder="Escreva algo..." autocomplete="off" />
    <button type="submit">Enviar</button>
  </form>
</div>

<div class="modal-overlay" id="settingsOverlay">
  <div class="modal">
    <h2>Configurações</h2>

    <div class="field">
      <label>Sua foto (aparece quando a câmera tá desligada)</label>
      <div class="avatar-row">
        <div class="avatar-preview" id="avatarPreview">?</div>
        <input type="file" id="avatarInput" accept="image/*" />
      </div>
    </div>

    <div class="field switch-row">
      <label style="margin:0">Supressão de ruído no microfone</label>
      <label class="switch">
        <input type="checkbox" id="noiseSuppressionToggle" checked />
        <span class="slider-bg"></span>
      </label>
    </div>

    <button class="close-btn secondary" id="closeSettingsBtn">Fechar</button>
  </div>
</div>

<script>
let peer, myId, roomCode, isHost = false;
let localStream = null;
let screenStream = null;
const dataConns = new Map();   // id -> DataConnection (host <-> clients)
const mediaConns = new Map();  // id -> MediaConnection (mesh, camera/mic)
const screenConns = new Map(); // id -> MediaConnection (mesh, screen share)
let memberIds = new Set();
let micOn = true, camOn = false, sharingScreen = false;
let myName = 'Anônimo';
let myAvatar = null;
let noiseSuppressionOn = true;

const chatMessages = document.getElementById('chatMessages');
const chatPanel = document.getElementById('chatPanel');

function displayChat(msg){
  const div = document.createElement('div');
  div.className = 'msg' + (msg.from === myId ? ' me' : '');
  const who = document.createElement('span');
  who.className = 'who';
  who.textContent = (msg.from === myId ? 'Você' : (msg.name || 'Amigo')) + ':';
  div.appendChild(who);
  div.appendChild(document.createTextNode(msg.text));
  chatMessages.appendChild(div);
  chatMessages.scrollTop = chatMessages.scrollHeight;
}

function sendChat(text){
  const msg = { type: 'chat', from: myId, name: myName, text };
  displayChat(msg);
  if (isHost){
    for (const conn of dataConns.values()) if (conn.open) conn.send(msg);
  } else {
    const conn = dataConns.get(roomCode);
    if (conn && conn.open) conn.send(msg);
  }
}

document.getElementById('chatToggleBtn').onclick = () => {
  chatPanel.classList.toggle('open');
};
document.getElementById('chatForm').onsubmit = (e) => {
  e.preventDefault();
  const input = document.getElementById('chatInput');
  const text = input.value.trim();
  if (!text) return;
  sendChat(text);
  input.value = '';
};

const statusEl = document.getElementById('status');
const gridEl = document.getElementById('grid');
const hintEl = document.getElementById('hint');
const controlsEl = document.getElementById('controls');

function setStatus(t){ statusEl.textContent = t; }

function initialsFrom(name){
  return (name || '?').trim().charAt(0).toUpperCase();
}

function addTile(id, stream, label, opts){
  opts = opts || {};
  removeTile(id);
  const tile = document.createElement('div');
  tile.className = 'tile';
  tile.id = 'tile-' + id;

  const hasVideo = stream && stream.getVideoTracks().some(t => t.enabled && t.readyState === 'live');

  if (hasVideo){
    const video = document.createElement('video');
    video.autoplay = true;
    video.playsInline = true;
    if (id === myId) video.muted = true;
    video.srcObject = stream;
    video.onclick = () => {
      if (document.fullscreenElement === video) {
        document.exitFullscreen();
      } else {
        (video.requestFullscreen || video.webkitRequestFullscreen).call(video);
      }
    };
    tile.appendChild(video);
  } else {
    const wrap = document.createElement('div');
    wrap.className = 'avatar-tile';
    const avatarUrl = id === myId ? myAvatar : (opts.avatar || null);
    if (avatarUrl){
      const img = document.createElement('img');
      img.src = avatarUrl;
      wrap.appendChild(img);
    } else {
      const initials = document.createElement('div');
      initials.className = 'initials';
      initials.textContent = initialsFrom(label);
      wrap.appendChild(initials);
    }
    // ainda tocamos o áudio, mesmo sem exibir vídeo
    if (stream){
      const audioEl = document.createElement('audio');
      audioEl.autoplay = true;
      audioEl.srcObject = stream;
      if (id === myId) audioEl.muted = true;
      wrap.appendChild(audioEl);
    }
    tile.appendChild(wrap);
  }

  const lab = document.createElement('div');
  lab.className = 'label';
  lab.textContent = label;
  tile.appendChild(lab);
  gridEl.appendChild(tile);
}
function removeTile(id){
  const t = document.getElementById('tile-' + id);
  if (t) t.remove();
}

async function getLocalStream(){
  if (localStream) return localStream;
  localStream = await navigator.mediaDevices.getUserMedia({
    audio: {
      noiseSuppression: noiseSuppressionOn,
      echoCancellation: true,
      autoGainControl: true
    },
    video: false
  });
  addTile(myId, localStream, 'Você');
  return localStream;
}

function callPeer(id){
  if (mediaConns.has(id) || !localStream) return;
  const call = peer.call(id, localStream);
  wireMediaCall(call);
}
function wireMediaCall(call){
  mediaConns.set(call.peer, call);
  call.on('stream', remoteStream => {
    addTile(call.peer, remoteStream, 'Amigo');
  });
  call.on('close', () => { mediaConns.delete(call.peer); removeTile(call.peer); });
  call.on('error', () => { mediaConns.delete(call.peer); });
}

function handleMemberList(list){
  memberIds = new Set(list);
  for (const id of list){
    if (id === myId) continue;
    if (myId < id) callPeer(id); // regra pra evitar chamada duplicada
  }
}

function broadcastMemberList(){
  const list = [myId, ...dataConns.keys()];
  const msg = { type: 'peer-list', list };
  for (const conn of dataConns.values()){
    if (conn.open) conn.send(msg);
  }
  handleMemberList(list);
}

async function startPeer(asHost){
  await getLocalStream();
  isHost = asHost;
  peer = asHost ? new Peer(roomCode) : new Peer();

  peer.on('open', id => {
    myId = id;
    setStatus('conectado (' + (isHost ? 'host' : 'convidado') + ')');
    controlsEl.style.display = 'flex';
    hintEl.style.display = 'none';

    if (!isHost){
      const conn = peer.connect(roomCode, { reliable: true });
      dataConns.set(roomCode, conn);
      conn.on('data', data => {
        if (data.type === 'peer-list') handleMemberList(data.list);
        else if (data.type === 'chat') displayChat(data);
      });
      conn.on('close', () => setStatus('host desconectou'));
    }
  });

  peer.on('connection', conn => {
    // só o host recebe conexões de dados de outros
    dataConns.set(conn.peer, conn);
    conn.on('open', () => broadcastMemberList());
    conn.on('close', () => {
      dataConns.delete(conn.peer);
      broadcastMemberList();
    });
    conn.on('data', data => {
      if (data.type === 'chat'){
        displayChat(data);
        for (const [id, other] of dataConns){
          if (id !== conn.peer && other.open) other.send(data);
        }
      }
    });
  });

  peer.on('call', call => {
    call.answer(localStream);
    if (call.metadata && call.metadata.kind === 'screen'){
      screenConns.set(call.peer, call);
      call.on('stream', remoteStream => addTile('screen-' + call.peer, remoteStream, 'Tela de um amigo'));
      call.on('close', () => removeTile('screen-' + call.peer));
    } else {
      wireMediaCall(call);
    }
  });

  peer.on('error', err => {
    console.error(err);
    setStatus('erro: ' + err.type);
  });
}

document.getElementById('createBtn').onclick = () => {
  const code = document.getElementById('roomInput').value.trim();
  if (!code) return alert('Digite um código pra sua sala.');
  myName = document.getElementById('nameInput').value.trim() || 'Anônimo';
  roomCode = code;
  startPeer(true);
};

document.getElementById('joinBtn').onclick = () => {
  const code = document.getElementById('roomInput').value.trim();
  if (!code) return alert('Digite o código da sala pra entrar.');
  myName = document.getElementById('nameInput').value.trim() || 'Anônimo';
  roomCode = code;
  startPeer(false);
};

document.getElementById('micBtn').onclick = () => {
  if (!localStream) return;
  micOn = !micOn;
  localStream.getAudioTracks().forEach(t => t.enabled = micOn);
  document.getElementById('micBtn').classList.toggle('active', micOn);
};

document.getElementById('camBtn').onclick = async () => {
  if (!camOn){
    try {
      const camStream = await navigator.mediaDevices.getUserMedia({ video: true });
      const track = camStream.getVideoTracks()[0];
      localStream.addTrack(track);
      // renegocia stream de vídeo com todo mundo
      for (const id of mediaConns.keys()) callUpdateTrack(id, track);
      addTile(myId, localStream, 'Você');
      camOn = true;
    } catch(e){ alert('Não consegui acessar sua câmera.'); }
  } else {
    localStream.getVideoTracks().forEach(t => { t.stop(); localStream.removeTrack(t); });
    camOn = false;
    addTile(myId, localStream, 'Você');
  }
  document.getElementById('camBtn').classList.toggle('active', camOn);
};

function callUpdateTrack(id, track){
  const call = mediaConns.get(id);
  if (!call || !call.peerConnection) return;
  const sender = call.peerConnection.getSenders().find(s => s.track && s.track.kind === track.kind);
  if (sender) sender.replaceTrack(track);
}

document.getElementById('screenBtn').onclick = async () => {
  if (!sharingScreen){
    try {
      screenStream = await navigator.mediaDevices.getDisplayMedia({ video: true, audio: true });
    } catch(e){ return; }
    addTile('screen-' + myId, screenStream, 'Sua tela');
    for (const id of memberIds){
      if (id === myId) continue;
      const call = peer.call(id, screenStream, { metadata: { kind: 'screen' } });
      screenConns.set(id, call);
    }
    screenStream.getVideoTracks()[0].onended = () => stopScreenShare();
    sharingScreen = true;
    document.getElementById('screenBtn').classList.add('active');
  } else {
    stopScreenShare();
  }
};

function stopScreenShare(){
  if (screenStream) screenStream.getTracks().forEach(t => t.stop());
  removeTile('screen-' + myId);
  for (const call of screenConns.values()) call.close();
  screenConns.clear();
  sharingScreen = false;
  document.getElementById('screenBtn').classList.remove('active');
}

// recebe chamadas de tela de outros também (mesmo listener de peer.on('call'),
// distinguimos pelo fato de já termos uma media call daquele id ou não)
document.getElementById('leaveBtn').onclick = () => {
  if (peer) peer.destroy();
  location.reload();
};

// --- Configurações ---
const settingsOverlay = document.getElementById('settingsOverlay');
document.getElementById('settingsBtn').onclick = () => settingsOverlay.classList.add('open');
document.getElementById('closeSettingsBtn').onclick = () => settingsOverlay.classList.remove('open');
settingsOverlay.onclick = (e) => { if (e.target === settingsOverlay) settingsOverlay.classList.remove('open'); };

document.getElementById('avatarInput').onchange = (e) => {
  const file = e.target.files[0];
  if (!file) return;
  const reader = new FileReader();
  reader.onload = () => {
    myAvatar = reader.result;
    document.getElementById('avatarPreview').innerHTML = '<img src="' + myAvatar + '">';
    if (!camOn && localStream) addTile(myId, localStream, 'Você');
  };
  reader.readAsDataURL(file);
};

document.getElementById('noiseSuppressionToggle').onchange = async (e) => {
  noiseSuppressionOn = e.target.checked;
  if (localStream){
    const track = localStream.getAudioTracks()[0];
    if (track){
      try {
        await track.applyConstraints({ noiseSuppression: noiseSuppressionOn, echoCancellation: true, autoGainControl: true });
      } catch(err){ console.warn('Não deu pra ajustar a supressão de ruído em tempo real:', err); }
    }
  }
};
</script>
</body>
</html>
